# ESWS containerized stack.
#
#   wps         pywps middleware exposing every InVEST model (port 5000)
#   fileserver  static file server for input/output data (port 8001)
#   dashboard   Django WPS client dashboard (port 8000)
#   geoserver   OGC server the WPS handlers publish model outputs to (port 8080)
#
# Quick start:  make up   (or: docker compose up --build)
# Smoke tests:  make smoke

services:
  wps:
    build:
      context: .
      dockerfile: docker/Dockerfile.invest
    image: esws/wps
    command: python tools/wpsserver/wpsserver.py
    ports:
      # host port is overridable via .env (host 5000 is often taken by other stacks)
      - "${WPS_HOST_PORT:-5000}:5000"
    volumes:
      - ./:/app
      - wps_outputs:/tmp/wpsoutputs
      - gisdata:/gisdata
      # InVEST sample data, cached outside the repo by
      # scripts/fetch_invest_samples.sh. Read-only: it is reference data.
      - ${INVEST_SAMPLES:-/store/invest/samples}:/data/invest:ro
      # Shared with fileserver, which publishes it at /results/: gives table
      # outputs somewhere to be uploaded *to*, since a plain file server has no
      # upload protocol of its own.
      - results_tables:/app/data/results
      # Raster series granules, shared with geoserver, which reads them as an
      # ImageMosaic. Its own volume rather than a corner of gisdata: that one is
      # root-owned and the wps runs as mambauser, so it cannot write there.
      - mosaics:/mosaics
    environment:
      GEOSERVER_URL: http://geoserver:8080/geoserver
      # Advertised to WPS clients in the WMS URLs of published layers, so it has
      # to follow the host mapping below -- not the container port.
      GEOSERVER_PUBLIC_URL: http://localhost:${GEOSERVER_HOST_PORT:-8080}/geoserver
      GEOSERVER_USER: ${GEOSERVER_USER:-admin}
      GEOSERVER_PASS: ${GEOSERVER_PASS:-geoserver}
      WPS_WORKSPACE_PREFIX: esws-
      # statusLocation and asReference URLs are handed to clients, so they must
      # use the host mapping rather than the container port.
      WPS_OUTPUT_URL: http://localhost:${WPS_HOST_PORT:-5000}/outputs
      WPS_TABLE_UPLOAD_DIR: /app/data/results
      WPS_TABLE_UPLOAD_PATH: results
      # How a run's results are laid out on the destination server:
      #   run    - a workspace per run, layer names left as the model wrote them
      #   series - one layer per model output, a granule per run, addressed by time
      ESWS_RESULTS_LAYOUT: ${ESWS_RESULTS_LAYOUT:-run}
      # Where published vectors live: as shapefiles, or as PostGIS tables.
      # `series` needs postgis for vectors -- a shapefile cannot be appended to.
      ESWS_VECTOR_BACKEND: ${ESWS_VECTOR_BACKEND:-files}
      POSTGIS_HOST: postgis
      POSTGIS_PORT: "5432"
      POSTGIS_DB: ${POSTGIS_DB:-esws}
      POSTGIS_USER: ${POSTGIS_USER:-esws}
      POSTGIS_PASS: ${POSTGIS_PASS:-esws}
    depends_on:
      - geoserver
      - postgis

  fileserver:
    # Shares the wps image. Only the wps service declares the build: buildkit
    # builds compose services concurrently, so repeating the same build/image
    # pair here made three builders export the tag at once, which races and
    # fails the whole build with `image "esws/wps:latest": already exists`.
    image: esws/wps
    command: python tools/http_server.py
    ports:
      - "${FILESERVER_HOST_PORT:-8001}:8001"
    volumes:
      - ./:/app
      - gisdata:/gisdata
      # Served under /invest/, so demo tables (CSVs) have an HTTP URL the
      # dashboard can register as CSV elements.
      - ${INVEST_SAMPLES:-/store/invest/samples}:/app/data/invest:ro
      # Table outputs the wps uploads, published at /results/. See wps.
      - results_tables:/app/data/results:ro

  dashboard:
    image: esws/wps  # see fileserver
    # createsuperuser --noinput reads DJANGO_SUPERUSER_*. It exits non-zero once
    # the account exists, which is every start after the first, so its failure is
    # ignored -- without it the dashboard would come up with no account able to
    # log into it, and every page would redirect to a login nobody can pass.
    command: >
      sh -c "python tools/wpsclient/manage.py migrate --run-syncdb &&
             (python tools/wpsclient/manage.py createsuperuser --noinput || true) &&
             python tools/wpsclient/manage.py runserver 0.0.0.0:8000"
    ports:
      - "${DASHBOARD_HOST_PORT:-8000}:8000"
    volumes:
      - ./:/app
      # Read by the Templates source to prefill job forms with the sample
      # arguments recorded in InVEST's datastacks.
      - ${INVEST_SAMPLES:-/store/invest/samples}:/data/invest:ro
      # Shared with fileserver, which publishes it at /results/: gives table
      # outputs somewhere to be uploaded *to*, since a plain file server has no
      # upload protocol of its own.
      - results_tables:/app/data/results
    environment:
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_DB_PATH: /tmp/esws-db.sqlite3
      WPS_SERVER_URL: http://wps:5000/wps
      # The first administrator. Everyone else is created through the Django
      # admin at /admin/; this one exists so there is somebody to create them.
      # An admin sees every user's servers, elements and jobs, which is what the
      # dashboard did for everyone before there were accounts.
      DJANGO_SUPERUSER_USERNAME: ${DASHBOARD_ADMIN_USER:-admin}
      DJANGO_SUPERUSER_PASSWORD: ${DASHBOARD_ADMIN_PASS:-esws-admin}
      DJANGO_SUPERUSER_EMAIL: ${DASHBOARD_ADMIN_EMAIL:-admin@example.invalid}
    depends_on:
      - wps

  postgis:
    # Vector backend for ESWS_VECTOR_BACKEND=postgis, and the granule index for
    # ESWS_RESULTS_LAYOUT=series. Unused by the defaults, but cheap to leave up.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGIS_DB:-esws}
      POSTGRES_USER: ${POSTGIS_USER:-esws}
      POSTGRES_PASSWORD: ${POSTGIS_PASS:-esws}
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGIS_USER:-esws} -d ${POSTGIS_DB:-esws}"]
      interval: 5s
      timeout: 5s
      retries: 20

  geoserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.geoserver
    image: esws/geoserver
    ports:
      - "${GEOSERVER_HOST_PORT:-8080}:8080"
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_PASS:-geoserver}
      SKIP_DEMO_DATA: "true"
    volumes:
      - gisdata:/gisdata
      - geoserver_data:/opt/geoserver_data
      # CRSs with no EPSG code, chiefly the MODIS sinusoidal grid. Without this
      # GeoServer cannot name them and leaves those layers disabled.
      - ./docker/geoserver/epsg.properties:/opt/geoserver_data/user_projections/epsg.properties:ro
      # See wps: granule files for ESWS_RESULTS_LAYOUT=series.
      - mosaics:/mosaics

volumes:
  mosaics:
  postgis_data:
  wps_outputs:
  results_tables:
  gisdata:
  geoserver_data:
