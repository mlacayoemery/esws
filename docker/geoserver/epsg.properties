# Extra CRS definitions for GeoServer, mounted at
# $GEOSERVER_DATA_DIR/user_projections/epsg.properties.
#
# 996842 -- MODIS Sinusoidal. NASA publishes this projection's WKT verbatim in the
# LP DAAC product user guides, DATUM["D_unknown"] and all, so a file carrying it
# is complete rather than damaged. It has no EPSG code and never has: a spherical
# projection referenced to WGS 84 is not something the EPSG model expresses, so
# the definition travels in the product metadata instead.
#
SR-ORG:6842 is the long-standing convention for it, from the namespace that
# spatialreference.org has since retired, where it was titled "MODIS Sinusoidal".
# It is the only one of the three SR-ORG variants that is self-consistent: 6964
# declares the WGS 84 equatorial radius instead of the authalic one, and
# 6973/6974 carry a correct WKT alongside a proj4 string that drops the sphere.
#
# The code here is 996842, NOT 6842. This file extends the EPSG namespace, and
# EPSG:6842 is already assigned -- to NAD83(2011) / Oregon Coast zone (m).
# Registering 6842 does not fail: GeoServer keeps its own definition, publishes
# the layer as Oregon Coast, and serves the right coordinates under a .prj from
# the wrong side of the planet. The 99 prefix keeps the SR-ORG lineage legible
# while landing somewhere the EPSG registry does not use.
#
# Registering it here is what lets InVEST's forest_carbon_edge_effect regression
# parameters -- a pantropical MODIS-grid dataset -- be served over WFS.
996842=PROJCS["Sinusoidal",GEOGCS["GCS_Undefined",DATUM["Undefined",SPHEROID["User_Defined_Spheroid",6371007.181,0.0]],PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]],PROJECTION["Sinusoidal"],PARAMETER["False_Easting",0.0],PARAMETER["False_Northing",0.0],PARAMETER["Central_Meridian",0.0],UNIT["Meter",1.0]]
