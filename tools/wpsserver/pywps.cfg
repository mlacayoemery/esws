[server]
encoding=utf-8
language=en-US
url=http://localhost:5000/wps
maxrequestsize=30mb
maxsingleinputsize=100mb
maxprocesses=10
parallelprocesses=2
workdir=/tmp
outputurl=http://localhost:5000/outputs
outputpath=/tmp/wpsoutputs
storedbtype=sqlite
storedb=/tmp/pywps-store.sqlite3

[logging]
level=INFO
file=/tmp/pywps.log
database=sqlite:////tmp/pywps-logs.sqlite3
format=%(asctime)s] [%(levelname)s] %(message)s

[metadata:main]
identification_title=ESWS PyWPS Server
identification_abstract=Ecosystem Service Web Services — InVEST models exposed via OGC WPS
identification_keywords=GIS,WPS,InVEST,ecosystem services
identification_keywords_type=theme
identification_fees=None
identification_accessconstraints=None
provider_name=University of Geneva
provider_url=http://esws.unige.ch
contact_name=Martin Lacayo
contact_position=Researcher
contact_address=Boulevard Carl-Vogt 66
contact_city=Geneva
contact_postalcode=1205
contact_country=ch
contact_email=martin.lacayo@unige.ch
contact_url=http://esws.unige.ch
